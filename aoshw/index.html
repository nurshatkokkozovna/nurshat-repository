<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Котята и AOS</title>
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="block" data-aos="fade-down">
     Любите кошек? Добро пожаловать!
  </div>

  <div class="block" data-aos="fade-up">
     Кошки могут быть очень ласковыми
    <img src="./images/cat (1).jpg" alt="котик">
  </div>

  <div class="block" data-aos="fade-right">
     Игровая активность помогает кошкам быть здоровыми
    <img src="./images/cat (2).jpg" alt="котик">
  </div>

  <div class="block" data-aos="fade-left">
     Кошки любят исследовать новые места
    <img src="./images/cat (3).jpg" alt="котик">
  </div>

  <div class="block" data-aos="zoom-in">
     Кошки умеют удивлять нас своей грацией
    <img src="./images/cat (4).jpg" alt="котик">
  </div>

  <div class="block" data-aos="flip-up">
     Разные породы имеют уникальный характер
    <img src="./images/cat (5).jpg" alt="котик">
  </div>

  <div class="block" data-aos="fade-up">
     Любите кошек — любите уют!
    <img src="./images/cat (6).jpg" alt="котик">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <script src="script.js"></script>

</body>
</html>
