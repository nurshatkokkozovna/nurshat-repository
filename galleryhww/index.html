<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Masonry</title>

  <!-- GLightbox -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">

  <link rel="stylesheet" href="./stysle.css">
</head>
<body>

<section class="gallery">
  <h1 class="gallery__title">Photo Gallery</h1>

  <div class="gallery__grid">

    <a href="https://picsum.photos/id/1015/1200/900" class="gallery__item glightbox">
      <img src="https://picsum.photos/id/1015/400/300" alt="">
    </a>

    <a href="https://picsum.photos/id/1011/1200/800" class="gallery__item glightbox tall">
      <img src="https://picsum.photos/id/1011/400/600" alt="">
    </a>

    <a href="https://picsum.photos/id/1025/1200/900" class="gallery__item glightbox">
      <img src="https://picsum.photos/id/1025/400/300" alt="">
    </a>

    <a href="https://picsum.photos/id/1035/1200/900" class="gallery__item glightbox wide">
      <img src="https://picsum.photos/id/1035/600/400" alt="">
    </a>

    <a href="https://picsum.photos/id/1060/1200/800" class="gallery__item glightbox">
      <img src="https://picsum.photos/id/1060/400/300" alt="">
    </a>

    <a href="https://picsum.photos/id/1043/1200/900" class="gallery__item glightbox tall">
      <img src="https://picsum.photos/id/1043/400/600" alt="">
    </a>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script src="script.js"></script>
</body>
</html>
